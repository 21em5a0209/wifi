<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi - Project Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .wifi-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        p {
            color: #666;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin-top: 30px;
            text-align: left;
        }
        
        .info h2 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .info ul {
            list-style-position: inside;
            color: #666;
        }
        
        .info li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wifi-icon">📡</div>
        <h1>WiFi Project</h1>
        <p>Welcome to the WiFi project repository!</p>
        <p>This is your GitHub Pages site, hosted directly from your repository.</p>
        
     <!--   <a href="https://github.com/21em5a0209/wifi" class="button">View on GitHub</a> -->
        
        <div class="info">
            <h2>About This Project</h2>
            <ul>
                <li>Repository: 21em5a0209/wifi</li>
                <li>Hosted on GitHub Pages</li>
                <li>Live at: https://21em5a0209.github.io/wifi/</li>
                <li>Static HTML site</li>
            </ul>
        </div>
    </div>
</body>
</html>
